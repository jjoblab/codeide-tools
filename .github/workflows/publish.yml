name: Publier

# Publie une révision <id>-<version>-r<rev> : JAMAIS d'écrasement d'asset
# (immuabilité ; un correctif = révision r2). Séquence :
#   build (matrice) -> SMOKE sur bionique aarch64 (porte OBLIGATOIRE :
#   une version sans smoke réussi n'entre pas dans le manifeste) -> release
#   + manifestes (v2 immuable + latest + v1) + gh-pages + attestation.
# Les composants pointeurs Google (cmdline-tools, platform) n'ont pas
# d'asset : ils entrent au manifeste après vérification smoke de leur
# vérification (sdkmanager --version) côté bionic.

on:
  workflow_dispatch:
    inputs:
      components:
        description: "id@version collés par virgules (ex. build-tools@35.0.2,platform-tools@35.0.2)"
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write
  pages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-component.yml
    with:
      components: ${{ inputs.components }}

  smoke:
    needs: build
    runs-on: ubuntu-24.04-arm   # arm64 : le conteneur bionic aarch64 s'exécute nativement
    steps:
      # Checkout et artefacts sur l'HÔTE glibc : les actions GitHub (node20)
      # ne peuvent pas s'exécuter dans un conteneur bionic.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: dist-*, merge-multiple: true }

      - name: Banc bionic — manifeste de test + crochet de téléchargement
        run: |
          set -eu
          mkdir -p smoke/fetch smoke/tmp smoke/home
          cp dist/*.tar.xz smoke/fetch/
          python3 - <<'PY'
          # Manifeste local de test : composants construits servis par le crochet
          # (le téléchargement réel via GitHub Releases est testé par smoke.yml).
          # AUTO-SUFFISANT : entrées dérivées des artefacts TÉLÉCHARGÉS
          # (dist/*.sha256 + *.tar.xz du job build) — JAMAIS de build/artifacts.json
          # du checkout : il ne contient les nouvelles versions qu'APRÈS le commit
          # de publication (étape en aval du smoke — dépendance circulaire).
          import glob, json, os, re
          comps = []
          for sha_file in sorted(glob.glob("dist/*.sha256")):
              name = os.path.basename(sha_file)
              if not name.endswith(".tar.xz.sha256"):
                  continue
              name = name[: -len(".tar.xz.sha256")]
              m = re.match(r"([a-z-]+)-([0-9.]+)-(r[0-9]+)-(aarch64|arm|x86_64)$", name)
              if not m:
                  continue
              comps.append({
                  "id": m.group(1), "version": m.group(2), "revision": m.group(3),
                  "arch": m.group(4), "channel": "stable", "critical": True,
                  "sources": [{"url": "https://example.invalid/" + name + ".tar.xz"}],
                  "sha256": open(sha_file).read().split()[0],
                  "size": os.path.getsize(f"dist/{name}.tar.xz"),
                  "installPath": (f"build-tools/{m.group(2)}" if m.group(1) == "build-tools"
                                  else "platform-tools"),
                  "requires": ["jdk>=17"],
                  "verify": ({"cmd": f"build-tools/{m.group(2)}/aapt2 version",
                              "expect": "Android Asset Packaging Tool"}
                             if m.group(1) == "build-tools" else
                             {"cmd": "platform-tools/adb --version", "expect": "Android Debug Bridge"}),
              })
          json.dump({"schemaVersion": 2, "generatedAt": "2026-01-01T00:00:00Z",
                     "components": comps, "profiles": {}, "compat": []},
                    open("smoke/smoke-manifest.json", "w"), indent=2)
          print(f"manifeste de test : {len(comps)} entrées")
          PY
          cat > smoke/fake-fetch <<'EOF'
          #!/system/bin/sh
          # (/system/bin/sh existe dans l'image bionic ; /usr/bin/env n'y
          # existe pas — shebang résolu par le noyau à l'exécution directe.)
          out=; url=
          while [ $# -gt 0 ]; do
            case $1 in
              -o) out=$2; shift 2 ;;
              *) url=$1; shift ;;
            esac
          done
          cp "$(dirname "$0")/fetch/$(basename "$url")" "$out"
          EOF
          chmod +x smoke/fake-fetch

      - name: Smoke — install + verify --deep sur bionic aarch64 (termux-docker)
        run: |
          set -eu
          # L'entrypoint de l'image exécute la commande via « su … system »
          # (uid 1000) : ne PAS le contourner (--entrypoint) — pkg refuse root,
          # et le env -i de l'entrypoint éliminerait toute var -e. Le banc doit
          # être inscriptible pour cet uid (les volumes appartiennent au runner).
          chmod -R a+rwX smoke
          docker run --rm \
            -v "$PWD:/repo" -v "$PWD/smoke:/smoke" \
            termux/termux-docker:latest \
            /data/data/com.termux/files/usr/bin/bash -exc '
              export PATH=/data/data/com.termux/files/usr/bin:$PATH
              export HOME=/smoke/home TMPDIR=/smoke/tmp
              export CODEIDE_TOOLS_MANIFEST=/smoke/smoke-manifest.json
              export CODEIDE_FETCH_CMD=/smoke/fake-fetch
              pkg update -y >/dev/null 2>&1 || true
              pkg install -y jq coreutils tar xz-utils 2>/dev/null || pkg install -y jq coreutils tar xz
              cd /repo
              # Exécution RÉELLE de chaque binaire sur bionic (aapt2 version, adb --version) :
              sh cli/codeide-sdk install $(echo "${{ inputs.components }}" | tr "," " ") \
                --arch aarch64 --root /smoke/sdk || exit 5
              sh cli/codeide-sdk verify --deep --root /smoke/sdk || exit 5
              echo "SMOKE OK (bionic aarch64)"
            '

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m pip install --quiet pyyaml jsonschema
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: dist-*, merge-multiple: true }

      - name: Fusionne artifacts.json depuis dist (première publication)
        run: |
          python3 - <<'PY'
          # Les nouvelles versions n'existent pas encore dans build/artifacts.json
          # committé (le commit de publication est en AVAL de gen-manifest :
          # dépendance circulaire sinon). Fusion ADDITIVE depuis les artefacts
          # téléchargés ; immuabilité préservée (sha différent sur clé existante
          # = échec net, jamais d'écrasement silencieux).
          import glob, json, os, re, sys
          path = "build/artifacts.json"
          data = json.load(open(path)) if os.path.exists(path) else {}
          for sha_file in sorted(glob.glob("dist/*.sha256")):
              name = os.path.basename(sha_file)
              if not name.endswith(".tar.xz.sha256"):
                  continue
              name = name[: -len(".tar.xz.sha256")]
              if not re.match(r"[a-z-]+-[0-9.]+-r[0-9]+-(aarch64|arm|x86_64)$", name):
                  continue
              sha = open(sha_file).read().split()[0]
              if name in data and data[name]["sha256"] != sha:
                  sys.exit(f"IMMUABILITÉ : {name} committé {data[name]['sha256'][:12]}… "
                           f"≠ construit {sha[:12]}… — révision r2 requise")
              data[name] = {"sha256": sha,
                            "size": os.path.getsize(f"dist/{name}.tar.xz"),
                            "archive": f"{name}.tar.xz"}
          with open(path, "w") as fh:
              json.dump(data, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(f"artifacts.json : {len(data)} entrées")
          PY

      - name: Évidence smoke → catalogue (porte bionic du run courant)
        run: |
          python3 - <<'PY'
          # La porte bionic du job smoke (needs: [smoke] satisfait) est une
          # ÉVIDENCE d'exécution réelle (install + verify --deep + aapt2):
          # aarch64 → ok, source = ce run. arm/x86_64 restent pending (non
          # exécutés ici — smoke.yml les couvrira). Édition chirurgicale du
          # YAML (regex sur la ligne exacte) : PAS de round-trip yaml.safe_dump
          # qui détruirait les commentaires de documentation du catalogue.
          import os, re, sys
          run_url = (f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                     f"/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          for spec in os.environ["COMPONENTS"].split(","):
              cid, version = spec.split("@")
              path = f"catalog/components/{cid}.yaml"
              text = open(path).read()
              # bloc smoke: "<version>": puis ligne aarch64 pending → ok
              pat = re.compile(
                  r'^(?P<vin>[ ]+)"' + re.escape(version) + r'":\n(?P<ain>[ ]+)aarch64: \{ status: pending, reason: "[^"]*" \}$',
                  re.MULTILINE)
              m = pat.search(text)
              if m:
                  new_block = (m.group("vin") + f'"{version}":\n' + m.group("ain")
                               + "aarch64: { status: ok, "
                               f'source: "{run_url} — porte bionic publish.yml (install+verify+aapt2)" }}')
                  text = text[:m.start()] + new_block + text[m.end():]
                  open(path, "w").write(text)
                  print(f"catalogue : {cid}@{version} aarch64 smoke ok ({run_url})")
              elif re.search(r'"' + re.escape(version) + r'":\n\s+aarch64: \{ status: ok', text):
                  print(f"catalogue : {cid}@{version} aarch64 déjà ok (idempotent)")
              else:
                  sys.exit(f"catalogue : motif smoke aarch64 introuvable pour {cid}@{version} "
                           "— vérifier catalog/components/ (échec net, pas de repli)")
          PY
        env:
          COMPONENTS: ${{ inputs.components }}

      - name: Régénérer les manifestes (v2 + v1 + COMPAT.md)
        run: python3 build/gen-manifest.py

      - name: Créer la/les release(s) — jamais d'écrasement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          specs=$(echo "${{ inputs.components }}" | tr ',' ' ')
          for spec in $specs; do
            id=${spec%%@*}; version=${spec##*@}
            rev=$(python3 build/catalog-query.py versions "$id" | awk -F'\t' -v v="$version" '$1==v{print $2}')
            tag="$id-$version-$rev"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "La release $tag existe déjà — IMMUABILITÉ : refus d'écrasement (nouvelle révision requise)"
              exit 1
            fi
            files=$(ls dist/$id-$version-$rev-*.tar.xz dist/$id-$version-$rev-*.sha256 2>/dev/null || true)
            prov="dist/$tag/provenance.json"
            [ -f "$prov" ] || mkdir -p "dist/$tag" && cp -r dist/$id-$version-$rev/provenance.json "dist/$tag/" 2>/dev/null || true
            gh release create "$tag" "dist/$id-$version-$rev-*.tar.xz" "dist/$id-$version-$rev-*.sha256" \
              "dist/$tag/provenance.json" --repo "$GITHUB_REPOSITORY" \
              --title "$tag" --generate-notes
          done

      - name: SHA256SUMS par release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for spec in $(echo "${{ inputs.components }}" | tr ',' ' '); do
            id=${spec%%@*}; version=${spec##*@}
            rev=$(python3 build/catalog-query.py versions "$id" | awk -F'\t' -v v="$version" '$1==v{print $2}')
            ( cd dist && sha256sum "$id-$version-$rev-"*.tar.xz >"$id-$version-$rev-SHA256SUMS" )
            gh release upload "$id-$version-$rev" "dist/$id-$version-$rev-SHA256SUMS" --repo "$GITHUB_REPOSITORY"
          done

      - name: Attestation de provenance (ADR 0007)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.tar.xz, dist/manifest.v2.json"

      - name: Publier main (catalogue + manifestes committés)
        run: |
          git config user.name "jjoblab"
          git config user.email "150948254+jjoblab@users.noreply.github.com"
          git add manifest.json docs/COMPAT.md dist/manifest.v2.json build/artifacts.json catalog 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: publie ${{ inputs.components }} (manifestes régénérés)"
          git push

      - name: Publier gh-pages (manifeste v2 immuable + latest)
        run: |
          set -eu
          ts=$(date -u +%Y%m%d-%H%M%S)
          # Historique IMMUABLE conservé : clone de la branche existante
          # (manifests/v2/<anciens ts>.json persistants) ; latest.json seul est
          # remplacé. git init + force-push ne servait qu'à la première fois.
          rm -rf gh-pages
          if git clone -q --branch gh-pages --depth 1 \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages; then
            echo "branche gh-pages existante : historique conservé"
          else
            mkdir -p gh-pages && (cd gh-pages && git init -q -b gh-pages)
          fi
          mkdir -p gh-pages/manifests/v2
          cp dist/manifest.v2.json "gh-pages/manifests/v2/$ts.json"
          cp dist/manifest.v2.json gh-pages/manifests/v2/latest.json
          cd gh-pages
          git config user.name "jjoblab"
          git config user.email "150948254+jjoblab@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -qm "manifeste v2 $ts"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages:gh-pages \
            || git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages:gh-pages
