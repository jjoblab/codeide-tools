name: Smoke tests

# Vérification d'exécution RÉELLE sur bionic aarch64 (runner public arm64 +
# image Termux — piste § 7 du prompt, à valider au premier run, ADR 0009).
# Porte de publication : marque smoke ok dans le catalogue (channel stable)
# uniquement si `verify --deep` passe ; sinon la version reste preview.
# Utilisé seul (re-vérification post-publication, téléchargement réel depuis
# les URLs du manifeste) ou par publish.yml (avant publication).

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "URL du manifeste à tester (vide = manifests/v2/latest.json publié)"
        type: string
        default: ""
  schedule:
    - cron: "0 5 * * 1"   # chaque lundi 05:00 UTC : re-vérifie le manifeste publié

permissions:
  contents: write   # commit du catalogue si un smoke passe (stable) ou échoue

jobs:
  smoke:
    runs-on: ubuntu-24.04-arm
    container:
      image: termux/termux-docker:latest
      options: --user root
    steps:
      - name: Environnement Termux
        run: |
          export PATH=/data/data/com.termux/files/usr/bin:$PATH
          pkg install -y curl jq tar xz python
          uname -m   # doit afficher aarch64
      - uses: actions/checkout@v4

      - name: codeide-sdk doctor (sorties réelles)
        env:
          MANIFEST: ${{ inputs.manifest || 'https://jjoblab.github.io/codeide-tools/manifests/v2/latest.json' }}
        run: |
          export PATH=/data/data/com.termux/files/usr/bin:$PATH
          export CODEIDE_TOOLS_MANIFEST="$MANIFEST"
          export CODEIDE_SDK_ROOT="$HOME/smoke-sdk"
          sh cli/codeide-sdk doctor || true   # diagnostic complet, jamais muet

      - name: Téléchargement réel + installation du profil default
        env:
          MANIFEST: ${{ inputs.manifest || 'https://jjoblab.github.io/codeide-tools/manifests/v2/latest.json' }}
        run: |
          export PATH=/data/data/com.termux/files/usr/bin:$PATH
          export CODEIDE_TOOLS_MANIFEST="$MANIFEST"
          export CODEIDE_SDK_ROOT="$HOME/smoke-sdk"
          sh cli/codeide-sdk install --profile default

      - name: verify --deep (chaque binaire exécuté, motif vérifié)
        env:
          MANIFEST: ${{ inputs.manifest || 'https://jjoblab.github.io/codeide-tools/manifests/v2/latest.json' }}
        run: |
          export PATH=/data/data/com.termux/files/usr/bin:$PATH
          export CODEIDE_TOOLS_MANIFEST="$MANIFEST"
          export CODEIDE_SDK_ROOT="$HOME/smoke-sdk"
          sh cli/codeide-sdk verify --deep

      - name: Marquer le catalogue si tout passe (stable)
        if: success()
        run: |
          # Le passage smoke.yml est enregistré par le mainteneur via PR :
          # ce job produit un artefact de preuve, la bascule catalogue reste
          # une PR revue (le catalogue = code review, ADR 0009).
          export PATH=/data/data/com.termux/files/usr/bin:$PATH
          { echo "SMOKE OK $(date -u +%Y-%m-%dT%H:%M:%SZ)"; \
            sh cli/codeide-sdk verify --deep --json 2>/dev/null || true; } > smoke-proof.txt
          cat smoke-proof.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-proof
          path: smoke-proof.txt
