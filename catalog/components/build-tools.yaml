# Composant build-tools (bionique) — reconditionné depuis Lzhiyong/android-sdk-tools.
# Archive v2 : <id>-<version>-r<rev>-<arch>.tar.xz, racine = racine du SDK,
# contenu = build-tools/<version>/ exactement (12.3).
id: build-tools
upstream: lzhiyong
critical: true
arch: [aarch64, arm, x86_64]
license: Apache-2.0
minAndroidApi: 30
install-path: build-tools/{version}
requires: ["jdk>=17"]
# Contenu de l'archive : les 6 binaires natifs du zip amont + core-lambda-stubs.jar
# (jar AOSP Apache-2.0, exigé par la validation BuildToolInfo d'AGP — note 07 § 2,
# jamais exécuté) + NOTICE.txt + source.properties (Pkg.Revision = version).
content:
  binaries: [aapt, aapt2, aidl, dexdump, split-select, zipalign]
  lambda-stubs: build/vendor/core-lambda-stubs/{version}.jar
  source-properties: |
    Pkg.Desc=Android SDK Build-Tools {version}
    Pkg.UserSrc=false
    Pkg.Revision={version}
verify:
  cmd: build-tools/{version}/aapt2 version
  expect: "Android Asset Packaging Tool"
# Statut de fumée (ADR 0009) : une entrée 'ok' => channel stable ; sinon preview.
# aarch64/35.0.2 : mêmes octets binaires que la v1 consommée en production par
# CodeIDE v0.51+ (ADR 0082 du dépôt CodeIDE) ; l'archive v2 n'ajoute que des
# métadonnées (jar stub, source.properties, NOTICE) — smoke CI à confirmer.
smoke:
  "35.0.2":
    aarch64: { status: ok, source: "CodeIDE v0.51.0+ sur appareil (ADR 0082, dépôt CodeIDE) — binaires identiques" }
    arm:     { status: ok, source: "https://github.com/jjoblab/codeide-tools/actions/runs/37439785400 — smoke.yml bionic arm (install + verify --deep, téléchargement réel) — CPU émulé qemu-arm, bionique réel" }
    x86_64:  { status: ok, source: "https://github.com/jjoblab/codeide-tools/actions/runs/37429101295 — smoke.yml bionic x86_64 (install + verify --deep, téléchargement réel)" }
  "34.0.3":
    aarch64: { status: ok, source: "https://github.com/jjoblab/codeide-tools/actions/runs/37429101295 — smoke.yml bionic aarch64 (install + verify --deep, téléchargement réel)" }
    arm:     { status: ok, source: "https://github.com/jjoblab/codeide-tools/actions/runs/37439785400 — smoke.yml bionic arm (install + verify --deep, téléchargement réel) — CPU émulé qemu-arm, bionique réel" }
    x86_64:  { status: ok, source: "https://github.com/jjoblab/codeide-tools/actions/runs/37429101295 — smoke.yml bionic x86_64 (install + verify --deep, téléchargement réel)" }
  "33.0.3":
    aarch64: { status: ok, source: "https://github.com/jjoblab/codeide-tools/actions/runs/37429101295 — smoke.yml bionic aarch64 (install + verify --deep, téléchargement réel)" }
    arm:     { status: ok, source: "https://github.com/jjoblab/codeide-tools/actions/runs/37439785400 — smoke.yml bionic arm (install + verify --deep, téléchargement réel) — CPU émulé qemu-arm, bionique réel" }
    x86_64:  { status: ok, source: "https://github.com/jjoblab/codeide-tools/actions/runs/37429101295 — smoke.yml bionic x86_64 (install + verify --deep, téléchargement réel)" }
  "36.0.0":
    aarch64: { status: ok, source: "https://github.com/jjoblab/codeide-tools/actions/runs/37447551014 — porte bionic publish.yml (install+verify+aapt2)" }
    arm:     { status: pending, reason: "r1 : banc armv7 (Termux, bionic API 28) sans __tls_get_addr@LIBC_Q (API 29) — échec chargeur, run 37439785400 ; r2 (TLS initial-exec) : à re-tester" }
    x86_64:  { status: pending, reason: "r2 reconstruit (TLS initial-exec) — octets ≠ r1, re-attestation requise (smoke)" }
versions:
  - version: "36.0.0"
    revision: r2
    upstream: aosp
    minAndroidApi: 34
    notes: "PREMIÈRE version construite depuis les sources AOSP (tag android-16.0.0_r1, ADR 0012) — comble le gap AGP 9.x (minimale 36.0.0, ADR 0003) que l'amont Lzhiyong figé ne couvrira jamais ; compilée à l'API 34 (en-têtes bionic requis par libbase android-16 — surcharge par version, cf aosp.yaml). r2 : TLS initial-exec (le r1 arm référençait __tls_get_addr@LIBC_Q, absent du bionic API 28 du banc armv7 — run 37439785400 ; équivalent et plus rapide pour le TLS de l'exécutable, compatibilité bionic élargie)"
  - version: "35.0.2"
    revision: r1
    notes: "défaut AGP 8.13 sans auto-installation (>= 35.0.0) ; aapt2 lisible jusqu'à compileSdk 37 (R2)"
  - version: "34.0.3"
    revision: r1
    notes: "compileSdk <= 37 via override avec AGP 9.x ; aapt2 34 lit les plateformes 35+ (R2)"
  - version: "33.0.3"
    revision: r1
    notes: "compileSdk <= 34 uniquement (aapt2 33 ne lit pas les tables 35+) — R2"
